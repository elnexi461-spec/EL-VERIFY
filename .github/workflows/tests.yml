name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/report-export.js
          node --check frontend/app.js
      - name: Test report export
        run: node --test frontend/tests/*.test.js
      - name: Build Docker image
        run: docker build -t el-verify .
      - name: Smoke test container
        run: |
          docker run -d --name el-verify -p 8000:8000 el-verify
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              curl -fsSL http://127.0.0.1:8000/ | grep -q "EL-VERIFY"
              exit 0
            fi
            sleep 2
          done
          docker logs el-verify
          exit 1
